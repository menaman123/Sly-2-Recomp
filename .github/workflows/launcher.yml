# Builds, tests (LauncherModels, LauncherScreens, LauncherLint, LauncherOneClass) and packages the launcher on
# macOS arm64 / x86_64, Windows x64 and Linux x86_64 with the official Qt 6 kit (tools/ci/release_launcher.{sh,ps1}).
# The zips here carry the launcher only; windows-release.yml builds the Windows release with the game.
#
#   push to main / pull request    build + test + stage the launcher for every platform, uploaded as workflow artifacts
#   workflow_dispatch              by hand
name: Sly 2 launcher

on:
  push:
    branches: [main]
    paths: ['engine', 'engine/app/launcher/**', 'engine/tests/app/launcher/**', 'engine/tools/launcher_lint.py', 'launcher/**', 'tools/ci/release_launcher.*', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['engine', 'engine/app/launcher/**', 'engine/tests/app/launcher/**', 'engine/tools/launcher_lint.py', 'launcher/**', 'tools/ci/release_launcher.*', '.github/workflows/launcher.yml']
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            qt_host: mac
            qt_arch: clang_64
          - platform: macos-x86_64
            runner: macos-15-intel
            qt_host: mac
            qt_arch: clang_64
          - platform: linux-x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
    name: launcher ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # `git describe` names the version
      - name: Ninja
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; else sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 zip; fi
      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: tools/ci/release_launcher.sh (build, tests, stage, deploy Qt, asset scan, zip)
        run: tools/ci/release_launcher.sh --qt "$QT_ROOT_DIR" --tag "launcher-${GITHUB_SHA::7}"
      - name: the screens, as documentation
        run: mkdir -p screens && cp build-launcher/launcher_screens/*.png screens/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: sly2-launcher-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            screens/
          if-no-files-found: error

  windows:
    name: launcher windows-x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Qt ${{ env.QT_VERSION }} (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: tools/ci/release_launcher.ps1 (build, tests, stage, windeployqt, asset scan, zip)
        shell: pwsh
        run: ./tools/ci/release_launcher.ps1 -Qt "$env:QT_ROOT_DIR" -Tag "launcher-$($env:GITHUB_SHA.Substring(0,7))"
      - uses: actions/upload-artifact@v4
        with:
          name: sly2-launcher-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
