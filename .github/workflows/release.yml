# .github/workflows/release.yml -- Sly-2-Recomp release: on a version tag, ci.yml (asset scan + guard, the no-disc
# matrix, the LAUNCHER lanes, and -- where a self-hosted runner holds the disc -- the title lanes as a test), then
# the ENGINE BUNDLE + the COMPILER KIT per platform, the asset scan over EVERY file, SHA256SUMS + release-index.json,
# and a DRAFT GitHub release a maintainer reads and publishes.
#
#   git tag v0.1.0 && git push origin v0.1.0        (or: Actions -> Sly-2-Recomp release -> Run workflow)
#
# WHAT IS SHIPPED (decision D-A -- nothing game-derived is downloaded or published; D-B -- macOS arm64 + x86_64,
# Windows x64, Linux x86_64; no Vita). Three files per platform, all made from this repository and the engine alone:
#
#   sly2-launcher-<tag>-<platform>.{dmg,AppImage,zip}   the launcher players download: the engine's Qt 6 launcher
#                                                        (engine/app/launcher) carrying launcher/title.json. Built,
#                                                        tested headless and packaged by ci.yml's `launcher` job
#                                                        (engine/tools/ci/release_launcher.{sh,ps1}); attached here
#                                                        as is -- no second build on a tag.
#   engine-bundle-<platform>.tar.xz                      the ENGINE BUNDLE: the engine's static libraries, the tools
#                                                        that read a disc and regenerate a title's program (the two
#                                                        recompilers, the extractor), the headers, the title's SOURCE
#                                                        module, BUNDLE.json -- staged from a NO-DISC build with the
#                                                        self-contained *-dist preset (engine/tools/ci/
#                                                        stage_engine_bundle.sh: route B, the fallback shape -- the
#                                                        engine_bundle CMake target (route A, tools/dist/engine_bundle.py,
#                                                        the EXACT command templates nativeee-prepare replays) defines
#                                                        itself only in a DISC build, so a public runner cannot take it;
#                                                        the self-hosted title lane in ci.yml does, and its bundle,
#                                                        asset-scanned with the live ELF, REPLACES the public one here).
#                                                        The name is tools/prepare's lookup name.
#   compiler-<platform>.tar.xz                           the portable compiler+linker (clang; lld on Linux / lld-link
#                                                        on Windows; Apple's ld from the Command Line Tools on macOS),
#                                                        cut from the OFFICIAL LLVM release kit pinned by sha256 in
#                                                        engine/tools/toolchain/COMPILER_PINS.sha256 (fetch_compiler.
#                                                        {sh,ps1}; the download is cached by the pins' hash).
#   SHA256SUMS, release-index.json, NOTES.md             engine/tools/ci/release_index.py: the sums, the index in the
#                                                        shape of the GitHub Releases API (what the launcher reads;
#                                                        the launcher_cold_judge's fixture server mirrors it) with an
#                                                        x-nativeee block naming the three roles per platform, the notes.
#
# The player's disc is read on the player's machine by the launcher ("Preparing your game"): the ELF is extracted,
# recompiled with the bundle's tools, compiled with the shipped compiler against the bundle's headers and linked with
# the bundle's libraries -- once per (disc, release). Nothing of that ever leaves the player's machine.
#
# NOT in a release: no disc bytes, no extracted ELF or module, no recompiled code, no VU1 AOT pack, no textures,
# audio, FMVs, saves or states -- and no `nativeee` binary of a disc build. The old release model (the title lanes'
# recompiled folders) is gone; those lanes are a test in ci.yml and upload only run.meta / pack.txt.
#
# Platform keys: macos-arm64, macos-x86_64, linux-x86_64, windows-x86_64 -- <os>-<arch> as nativeee-prepare computes
# them at run time (x86_64 normalised; the Windows asset is therefore -x86_64, not -x64).
#
# Gates: ci.yml (the asset scan over both trees, the no-disc matrix, the launcher tests); per engine-bundle lane the
# build dir is refused unless it is a no-disc build, the staged folder and its zip are asset-scanned, the cut compiler
# compiles a real title TU against the bundle (bundle_smoke.sh) and is smoked on its own; the release job re-scans
# every downloaded file, release_index.py refuses stubs / unknown files / an incomplete platform (unless its lane failed,
# then that platform is named "not in this release" in NOTES.md and the index), and the release is a DRAFT.
#
# Secrets (all optional): MACOS_CODESIGN_IDENTITY (a Developer ID Application identity in the runner's keychain --
# import it in a step of your own before the launcher job if you have one; ad hoc otherwise), MACOS_NOTARY_PROFILE
# (a `xcrun notarytool store-credentials` profile name; notarize + staple the .dmg). Without them the macOS
# launcher is ad hoc signed: right-click > Open once (NOTES.md says so).
#
# Local validation: `python3 -c 'import yaml; yaml.safe_load(open(".github/workflows/release.yml"))'`,
# `actionlint .github/workflows/release.yml`; the macOS lane end to end on a Mac: engine/tools/ci/release_local.sh
# --title-root . (docs/RELEASING.md).
name: Sly-2-Recomp release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-run{0}', github.run_number) }}

jobs:
  ci:
    name: guard + no-disc matrix + launcher lanes (+ title lanes as a test)
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  # The engine bundle + the compiler kit, per platform. Separate from ci.yml's no-disc matrix on purpose: the bundle's
  # libraries must come from the self-contained *-dist presets (static SDL2 from the pinned release, the LGPL FFmpeg
  # recipe; Linux: libstdc++/libgcc static) so the player's link needs nothing from Homebrew / apt.
  engine-bundle:
    name: engine bundle + compiler ${{ matrix.target }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       target: macos-arm64,  platform: macos,   preset: macos-dist,               jobs: 3 }
          - { os: macos-15-intel, target: macos-x86_64, platform: macos,   preset: macos-dist,               jobs: 3 }
          - { os: ubuntu-22.04,   target: linux-x86_64, platform: linux,   preset: linux-dist,               jobs: 3 }
          - { os: windows-2022,   target: windows-x86_64,  platform: windows, preset: windows-clang-cl-release, jobs: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      SLY2_BUILD_DIR: ${{ github.workspace }}/../build
      NATIVEEE_TOOLCHAIN_CACHE: ${{ github.workspace }}/../toolchain-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Asset guard (--mode ci)
        shell: bash
        run: |
          python3 engine/tools/ci/asset_guard.py --root games --mode ci
          python3 engine/tools/ci/asset_guard.py --root engine --mode ci
      - name: The release names for this platform (tools/prepare's contract)
        id: names
        shell: bash
        run: |
          echo "folder=engine-bundle-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "archive=engine-bundle-${{ matrix.target }}.tar.xz" >> "$GITHUB_OUTPUT"

      # --- dependencies per host (ci.yml's, + nasm/pkg-config for the static FFmpeg recipe on macOS) --------------
      - name: Dependencies (macOS -- Homebrew; SDL2 + FFmpeg are built statically by the dist preset)
        if: matrix.platform == 'macos'
        run: brew install cmake ninja nasm pkg-config
      - name: Dependencies (Linux -- the engine's package list + nasm + zip)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046
          sudo apt-get install -y --no-install-recommends $(grep -v '^#' engine/tools/ci/linux_packages.txt | xargs) nasm zip
      - name: Dependencies (Windows -- Python for the clang-cl shim)
        if: matrix.platform == 'windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: vcpkg at the manifest's builtin-baseline
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $baseline = (Get-Content engine/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone --quiet https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT checkout --quiet $baseline
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: vcpkg binary cache (restore)
        if: matrix.platform == 'windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}
      - name: MSVC developer environment (clang-cl, lld-link, Ninja, the Windows SDK)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --- the compiler kit: the official LLVM release asset, cached by the pins' hash, sha256-verified on every run ----
      - name: Compiler kit cache (the pinned official LLVM tarball; ~1-2 GB, keyed on COMPILER_PINS.sha256)
        uses: actions/cache@v4
        with:
          path: ${{ env.NATIVEEE_TOOLCHAIN_CACHE }}
          key: compiler-kit-${{ matrix.target }}-${{ hashFiles('engine/tools/toolchain/COMPILER_PINS.sha256') }}
      - name: fetch_compiler.sh --smoke --pack (download, verify, cut, compile+link a program, zip)
        if: matrix.platform != 'windows'
        shell: bash
        run: engine/tools/toolchain/fetch_compiler.sh --platform ${{ matrix.target }} --out "$RUNNER_TEMP/compiler" --cache "$NATIVEEE_TOOLCHAIN_CACHE" --smoke --pack
      - name: fetch_compiler.ps1 -Smoke -Pack
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./engine/tools/toolchain/fetch_compiler.ps1 -Out "$env:RUNNER_TEMP\compiler" -Cache "$env:NATIVEEE_TOOLCHAIN_CACHE" -Smoke -Pack

      # --- the no-disc build with the self-contained preset: the bundle's source ----------------------------------------
      - name: build.sh --no-disc --preset ${{ matrix.preset }} (nativeee stub, the tools, the title's HLE library)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          ./build.sh --no-disc --preset ${{ matrix.preset }} --build-dir "$SLY2_BUILD_DIR" --jobs ${{ matrix.jobs }} \
            --target nativeee --target ps2r_recompiler_v2 --target ps2r_iop_recompiler --target ps2r_disc_extract \
            --target ps2r_elf_embedded --target vu1_aot_pack --target ps2r_title_hle 2>&1 | tee build.log
      - name: build.ps1 -NoDisc -Preset ${{ matrix.preset }} (the same targets; the clang-cl preset from the copied toolchain)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\build.ps1 -NoDisc -Preset ${{ matrix.preset }} -BuildDir "$env:SLY2_BUILD_DIR" -Jobs ${{ matrix.jobs }} -Targets nativeee,ps2r_recompiler_v2,ps2r_iop_recompiler,ps2r_disc_extract,ps2r_elf_embedded,vu1_aot_pack,ps2r_title_hle 2>&1 | Tee-Object -FilePath build.log
      - name: vcpkg binary cache (save)
        if: matrix.platform == 'windows' && always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('engine/vcpkg.json') }}

      # --- stage (refuses a disc build), scan, zip; then the pair works together -----------------------------------------
      - name: stage_engine_bundle.sh (engine_bundle target when present, else the fallback shape; asset scan; zip)
        shell: bash
        run: |
          engine/tools/ci/stage_engine_bundle.sh --engine engine --games games --build-dir "$SLY2_BUILD_DIR" \
            --out "$RUNNER_TEMP/bundle" --platform ${{ matrix.target }} --version "$RELEASE_TAG" \
            --name "${{ steps.names.outputs.folder }}" --compiler-json "$RUNNER_TEMP/compiler/compiler/COMPILER.json" 2>&1 | tee stage_engine_bundle.log
      - name: bundle_smoke.sh (the cut compiler compiles a title TU against the bundle; the archiver reads a bundle library)
        shell: bash
        run: engine/tools/ci/bundle_smoke.sh --bundle "$RUNNER_TEMP/bundle/${{ steps.names.outputs.folder }}" --compiler "$RUNNER_TEMP/compiler/compiler"
      - name: Asset scan over the compiler archive too (the lane's two uploads are both scanned here)
        shell: bash
        run: |
          mkdir -p upload
          cp "$RUNNER_TEMP/bundle/${{ steps.names.outputs.archive }}" upload/
          cp "$RUNNER_TEMP"/compiler/compiler-*.tar.xz upload/
          cp "$RUNNER_TEMP/bundle/asset_scan_${{ steps.names.outputs.folder }}.md" upload/ 2>/dev/null || true
          cp "$RUNNER_TEMP/bundle/${{ steps.names.outputs.folder }}/BUNDLE.json" "upload/BUNDLE-${{ matrix.target }}.json"
          for f in upload/*.tar.xz; do python3 engine/tools/ci/asset_scan.py "$f" --report "upload/asset_scan_$(basename "$f" .tar.xz).md"; done
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: upload/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-log-${{ matrix.target }}
          path: |
            build.log
            stage_engine_bundle.log
          if-no-files-found: ignore

  # The release: every artefact re-scanned, the sums and the index, a DRAFT. A platform whose lane failed is left out
  # and NAMED (NOTES.md, release-index.json x-nativeee.not_in_this_release); a release with no complete platform fails.
  release:
    name: asset scan + SHA256SUMS + release-index.json + DRAFT release
    needs: [ci, engine-bundle]
    if: ${{ !cancelled() && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: downloads/launcher
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: downloads/engine
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-bundle-disc-*
          path: downloads/disc
          merge-multiple: true
      - name: Collect the release files (archives, images; the reports stay here as a workflow artifact)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release reports
          find downloads/launcher downloads/engine -type f \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.STUB' \) -exec mv {} release/ \;
          # the self-hosted title lane's route-A bundle (the engine_bundle target, from a disc build, scanned there with the
          # live ELF) REPLACES the public lane's route-B bundle for the same platform: it carries the exact command templates
          if [ -d downloads/disc ]; then
            for f in downloads/disc/engine-bundle-*.tar.xz; do [ -f "$f" ] && { echo "route A bundle: $(basename "$f") replaces the public one"; mv -f "$f" release/; }; done
          fi
          find downloads -type f \( -name '*.md' -o -name '*.json' -o -name '*.sha256' \) -exec mv {} reports/ \;
          ls -la release reports
      - name: Asset scan over EVERY file that will be attached (the last gate)
        shell: bash
        run: |
          set -euo pipefail
          for f in release/*; do
            case "$f" in *.STUB) continue ;; esac
            python3 engine/tools/ci/asset_scan.py "$f" --report "reports/asset_scan_release_$(basename "$f").md"
          done
      - name: Platforms whose lane produced nothing (named, not hidden)
        id: missing
        shell: bash
        run: |
          missing=""
          for p in macos-arm64 macos-x86_64 linux-x86_64 windows-x86_64; do
            n=0   # launcher: -<p>.dmg|.AppImage|.zip; engine-bundle-<p>.tar.xz; compiler-<p>.tar.xz
            for f in release/*-"$p".*; do [ -e "$f" ] && n=$((n + 1)); done
            [ "$n" -ge 3 ] || missing="$missing,$p"
          done
          missing="${missing#,}"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "not in this release: ${missing:-none}"
      - name: SHA256SUMS + release-index.json + NOTES.md (release_index.py refuses stubs, unknown files, an incomplete platform)
        shell: bash
        run: |
          python3 engine/tools/ci/release_index.py --dir release --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --manifest launcher/title.json --engine-commit "$(git -C engine rev-parse HEAD)" --title-commit "$GITHUB_SHA" \
            ${{ steps.missing.outputs.missing && format('--allow-missing {0}', steps.missing.outputs.missing) || '' }}
          cat release/SHA256SUMS
          cat release/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            reports/
            release/release-index.json
            release/NOTES.md
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Sly 2: Band of Thieves ${{ env.RELEASE_TAG }}"
          body_path: release/NOTES.md
          files: |
            release/*.tar.xz
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/SHA256SUMS
            release/release-index.json
          fail_on_unmatched_files: false
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
